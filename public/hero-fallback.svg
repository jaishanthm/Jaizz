<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0E162B"/>
      <stop offset="60%" stop-color="#080D1A"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#2B6CFF" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#00E5FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#2B6CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="polyGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="polyGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="polyGrad3" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="900" fill="url(#bgGrad)"/>

  <!-- Cyber Grid Matrix (Subtle) -->
  <g stroke="#1E293B" stroke-width="0.5" opacity="0.35">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="0" y1="750" x2="1200" y2="750" />
    <line x1="200" y1="0" x2="200" y2="900" />
    <line x1="400" y1="0" x2="400" y2="900" />
    <line x1="600" y1="0" x2="600" y2="900" />
    <line x1="800" y1="0" x2="800" y2="900" />
    <line x1="1000" y1="0" x2="1000" y2="900" />
  </g>

  <!-- Central Glow -->
  <circle cx="600" cy="450" r="380" fill="url(#coreGlow)"/>

  <!-- Concentric Orbital Ticks & Target Rings -->
  <circle cx="600" cy="450" r="320" fill="none" stroke="#2B6CFF" stroke-width="1" stroke-dasharray="4,8" opacity="0.25"/>
  <circle cx="600" cy="450" r="240" fill="none" stroke="#00E5FF" stroke-width="1.2" stroke-dasharray="12,12" opacity="0.35"/>
  <circle cx="600" cy="450" r="160" fill="none" stroke="#3B82F6" stroke-width="0.8" opacity="0.3"/>

  <!-- Constellation Nodes & Connecting Rays -->
  <g stroke="#00E5FF" stroke-width="0.8" opacity="0.4">
    <line x1="600" y1="450" x2="420" y2="280" />
    <line x1="600" y1="450" x2="780" y2="260" />
    <line x1="600" y1="450" x2="840" y2="520" />
    <line x1="600" y1="450" x2="380" y2="580" />
    <line x1="600" y1="450" x2="520" y2="720" />
    <line x1="420" y1="280" x2="780" y2="260" />
    <line x1="780" y1="260" x2="840" y2="520" />
    <line x1="840" y1="520" x2="520" y2="720" />
    <line x1="520" y1="720" x2="380" y2="580" />
    <line x1="380" y1="580" x2="420" y2="280" />
  </g>

  <!-- Node Dots -->
  <g fill="#00E5FF">
    <circle cx="420" cy="280" r="3.5" filter="url(#glow)"/>
    <circle cx="780" cy="260" r="4" filter="url(#glow)"/>
    <circle cx="840" cy="520" r="3.5" filter="url(#glow)"/>
    <circle cx="520" cy="720" r="4" filter="url(#glow)"/>
    <circle cx="380" cy="580" r="3.5" filter="url(#glow)"/>
  </g>
  <g fill="#2B6CFF">
    <circle cx="300" cy="340" r="2.5" opacity="0.7"/>
    <circle cx="880" cy="360" r="2.5" opacity="0.7"/>
    <circle cx="720" cy="680" r="2.5" opacity="0.7"/>
    <circle cx="460" cy="180" r="2.5" opacity="0.7"/>
  </g>

  <!-- Faceted Crystalline Core (Icosahedron projection) -->
  <!-- Back / Lower facets -->
  <polygon points="600,450 480,360 490,530" fill="url(#polyGrad3)" stroke="#1E40AF" stroke-width="1"/>
  <polygon points="600,450 490,530 600,590" fill="url(#polyGrad1)" stroke="#1E40AF" stroke-width="1"/>
  <polygon points="600,450 600,590 710,530" fill="url(#polyGrad2)" stroke="#2563EB" stroke-width="1"/>
  <polygon points="600,450 710,530 720,360" fill="url(#polyGrad3)" stroke="#1E40AF" stroke-width="1"/>
  
  <!-- Upper & Front facets -->
  <polygon points="600,450 720,360 600,310" fill="url(#polyGrad1)" stroke="#3B82F6" stroke-width="1.2"/>
  <polygon points="600,450 600,310 480,360" fill="url(#polyGrad2)" stroke="#38BDF8" stroke-width="1.2"/>

  <!-- Core Outer Outline -->
  <polygon points="600,310 720,360 710,530 600,590 490,530 480,360" fill="none" stroke="#60A5FA" stroke-width="1.8" filter="url(#glow)"/>

  <!-- Center Core Node & Target Crosshairs -->
  <circle cx="600" cy="450" r="6" fill="#00E5FF" filter="url(#glow)"/>
  <circle cx="600" cy="450" r="1.5" fill="#FFFFFF"/>

  <!-- Axis & Telemetry Markers -->
  <g stroke="#00E5FF" stroke-width="1.5" opacity="0.6">
    <line x1="590" y1="450" x2="610" y2="450" />
    <line x1="600" y1="440" x2="600" y2="460" />
  </g>

  <!-- Technical Watermark / Identifier -->
  <text x="600" y="635" text-anchor="middle" fill="#5B8FFF" font-family="monospace" font-size="11" letter-spacing="4" opacity="0.7">
    SEC_CORE_SYS // LATTICE_STANDBY
  </text>
</svg>
